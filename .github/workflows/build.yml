name: build

# Manifest validation and the host build happen here. Device builds — the
# pinned MIPS toolchain, the ABI check and the .mapp packages — live in
# morpthis-build, which checks this repository out for them.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app.json
        run: python3 tools/validate-manifest.py --all apps

  host:
    name: Host build and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/morpthis-sdk
          path: sdk
      - name: Build and test
        run: make MORPTHIS_SDK="$GITHUB_WORKSPACE/sdk" test
      # Packaging logic only: host-mode .mapp files are not shipped. Device
      # packages come from morpthis-build.
      - name: Dry-run the packaging
        run: make MORPTHIS_MODE=host MORPTHIS_SDK="$GITHUB_WORKSPACE/sdk" package
