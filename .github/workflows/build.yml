name: build

# Manifest validation and the host build happen here. Device builds — the
# pinned MIPS toolchain, the ABI check and the .pkgmerp packages — live in
# morpthis-build, which checks this repository out for them.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app.json
        run: python3 tools/validate-manifest.py --all apps

  host:
    name: Host build and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/morpthis-sdk
          path: sdk
      - name: Fetch doomgeneric
        uses: actions/checkout@v4
        with:
          repository: ozkl/doomgeneric
          ref: e257a09527062bfb986b6e5e0780839b6cbd5b71
          path: doomgeneric
      - name: Apply the Morpthis Doom port
        run: git -C doomgeneric apply "$GITHUB_WORKSPACE/apps/doom/doomgeneric-morpthis.patch"
      - name: Install the packaging tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools
      - name: Build and test
        run: make MORPTHIS_SDK="$GITHUB_WORKSPACE/sdk" DOOMGENERIC_DIR="$GITHUB_WORKSPACE/doomgeneric/doomgeneric" test
      # Packaging logic only: host-mode .pkgmerp files are not shipped. Device
      # packages come from morpthis-build.
      - name: Run the Radio loopback streaming test
        run: make -C apps/radio MORPTHIS_MODE=host MORPTHIS_SDK="$GITHUB_WORKSPACE/sdk" test-integration

      - name: Dry-run the packaging
        run: make MORPTHIS_MODE=host MORPTHIS_SDK="$GITHUB_WORKSPACE/sdk" DOOMGENERIC_DIR="$GITHUB_WORKSPACE/doomgeneric/doomgeneric" package
